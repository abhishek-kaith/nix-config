[general]

[window]
opacity = 0.85

[window.padding]
x = 5
y = 5

[scrolling]
history               = 100000
multiplier            = 3

[font]
normal                = { family = "Iosevka Nerd Font Mono", style = "Medium" }
bold                  = { family = "Iosevka Nerd Font Mono", style = "Bold" }
italic                = { family = "Iosevka Nerd Font Mono", style = "Italic" }
bold_italic           = { family = "Iosevka Nerd Font Mono", style = "Bold Italic" }
size                  = 14

[selection]
save_to_clipboard = true

[[keyboard.bindings]]
key = "Space"
mods = "Control|Shift"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = ""

# ── colours ─────────────────────────────────────────────────────────
# NOT here any more. The palette lives in colors-dark.toml / colors-light.toml
# beside this file, and modules/home/alacritty.nix imports them in this order:
#
#   1. this file                              (settings, no colours)
#   2. colors-dark.toml                       (the palette, and the fallback)
#   3. ~/.config/alacritty/colors-active.toml (written by cosmic-theme-sync)
#
# Alacritty applies imports in order and a later one replaces an earlier one, so
# (3) wins when it exists — and missing imports are skipped, so if the sync
# service never runs you simply get (2), which is the old static behaviour.
