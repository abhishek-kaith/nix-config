# ── tokyonight (night) ───────────────────────────────────────────────
# The dark palette, and the FALLBACK for the whole scheme: modules/home/
# alacritty.nix imports this unconditionally, then imports colors-active.toml
# after it. If cosmic-theme-sync has never run, that second file does not exist,
# alacritty skips it, and you get exactly this — which is what the terminal
# looked like before any of the light/dark machinery existed.
#
# Matched to the nvim colourscheme (config/nvim) so the editor and the terminal
# around it agree. Keep the key set here IDENTICAL to colors-light.toml: imports
# replace key by key, so a key present here and missing there would leak its dark
# value into the light theme.
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.cursor]
text   = "#1a1b26"
cursor = "#c0caf5"

[colors.selection]
background = "#283457"
text       = "CellForeground"

[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"
