set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
# What Ghostty (TERM=xterm-ghostty) can do, stated rather than guessed:
# truecolour, OSC 52 clipboard, focus reporting, and the extended-keys
# protocol that keeps Ctrl+Shift+letter, Ctrl+Enter and friends distinct.
set -as terminal-features ",xterm-ghostty:RGB:clipboard:focus:extkeys"
# "on" passes those keys only to programs that ask for them (nvim does);
# the shell and everything else keep getting the classic sequences.
set -s extended-keys on
# A yank in tmux copy mode, or in nvim inside tmux, lands on the desktop
# clipboard (via OSC 52), and nvim sees focus changes for autoread.
set -s set-clipboard on
set -g focus-events on

set -s escape-time 0

bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1

bind -r m resize-pane -Z

set -g mouse on
set -g set-titles on
set -g set-titles-string "tmux - #W"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r H resize-pane -L 2
bind -r L resize-pane -R 2
bind -r K resize-pane -U 2
bind -r J resize-pane -D 2
